spring.application.name=backend
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5332/lostfound_db}
spring.datasource.username=${DB_USERNAME:lostfound_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

app.auth.token-ttl-minutes=${AUTH_TOKEN_TTL_MINUTES:10}
app.mail.from=${MAIL_FROM:no-reply@lostfound.local}

spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
